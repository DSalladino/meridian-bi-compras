name: Publicar demonstração

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar artefato estático
        run: |
          mkdir -p _site
          cp -r app data _site/
          touch _site/.nojekyll
          printf '%s\n' \
            '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">' \
            '<meta http-equiv="refresh" content="0; url=./app/">' \
            '<title>Meridian BI · Compras</title></head>' \
            '<body><p>Redirecionando para <a href="./app/">o painel Meridian BI</a>…</p></body></html>' \
            > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
