name: meridian-bi-prod

services:
  app:
    build: .
    image: meridian-bi:latest
    container_name: meridian-bi
    restart: unless-stopped
    ports:
      - "${MERIDIAN_PORT:-4173}:4173"
    environment:
      PORT: 4173
      # Troque no primeiro boot e faça login para trocar a senha.
      MERIDIAN_BOOTSTRAP_ADMIN: "${MERIDIAN_BOOTSTRAP_ADMIN:-}"
      # Gere com: openssl rand -base64 48
      MERIDIAN_SESSION_SECRET: "${MERIDIAN_SESSION_SECRET:?defina MERIDIAN_SESSION_SECRET no .env}"
      MERIDIAN_SECURE_COOKIE: "${MERIDIAN_SECURE_COOKIE:-0}"
      MERIDIAN_TRUST_PROXY: "${MERIDIAN_TRUST_PROXY:-0}"
      MERIDIAN_SESSION_HOURS: "${MERIDIAN_SESSION_HOURS:-8}"
      MERIDIAN_PUBLIC_URL: "${MERIDIAN_PUBLIC_URL:-}"
      MERIDIAN_OIDC_ISSUER: "${MERIDIAN_OIDC_ISSUER:-}"
      MERIDIAN_OIDC_CLIENT_ID: "${MERIDIAN_OIDC_CLIENT_ID:-}"
      MERIDIAN_OIDC_CLIENT_SECRET: "${MERIDIAN_OIDC_CLIENT_SECRET:-}"
      MERIDIAN_OIDC_REDIRECT_URI: "${MERIDIAN_OIDC_REDIRECT_URI:-}"
      MERIDIAN_OIDC_SCOPES: "${MERIDIAN_OIDC_SCOPES:-openid email profile}"
      MERIDIAN_OIDC_ROLE_CLAIM: "${MERIDIAN_OIDC_ROLE_CLAIM:-roles}"
      MERIDIAN_OIDC_ROLE_MAP: "${MERIDIAN_OIDC_ROLE_MAP:-}"
      MERIDIAN_OIDC_ADMIN_ROLES: "${MERIDIAN_OIDC_ADMIN_ROLES:-meridian-admin}"
      MERIDIAN_OIDC_ADMINS: "${MERIDIAN_OIDC_ADMINS:-}"
      MERIDIAN_OIDC_DEFAULT_ROLE: "${MERIDIAN_OIDC_DEFAULT_ROLE:-leitor}"
      MERIDIAN_OIDC_AUTO_PROVISION: "${MERIDIAN_OIDC_AUTO_PROVISION:-1}"
      MERIDIAN_OIDC_BUTTON_LABEL: "${MERIDIAN_OIDC_BUTTON_LABEL:-Entrar com SSO}"
    volumes:
      - meridian_data:/app/data
      - meridian_config:/app/config
      - meridian_logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  meridian_data:
  meridian_config:
  meridian_logs:
