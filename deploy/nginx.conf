# Exemplo de Nginx como terminador TLS para o painel.
#
# Pré-requisitos: certificado em /etc/letsencrypt/live/bi.suaempresa.com/
# Ajuste server_name e proxy_pass. Rode o app com:
#   MERIDIAN_SECURE_COOKIE=1 MERIDIAN_TRUST_PROXY=1

upstream meridian_app {
    server 127.0.0.1:4173;
    keepalive 16;
}

server {
    listen 80;
    server_name bi.suaempresa.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name bi.suaempresa.com;

    ssl_certificate     /etc/letsencrypt/live/bi.suaempresa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bi.suaempresa.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 12m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    location / {
        proxy_pass http://meridian_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/meridian-access.log;
    error_log  /var/log/nginx/meridian-error.log warn;
}
